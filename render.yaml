services:
  - type: web
    name: mahadev-jyotish-ai-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_ANALYTICAL_FALLBACK
        value: "true"
